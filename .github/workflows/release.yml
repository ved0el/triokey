name: Release

# Pushing a tag vX.Y.Z builds, signs and publishes that version (docs/RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu

jobs:
  # No secret and no write permission here: this job runs the tests and the build scripts of
  # every dependency.
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, for the check below
      # releases publish without a manual approval, so only a commit already on main may ship
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - name: Install the Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
      - name: Tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "triokey") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the triokey crate version $version"
            exit 1
          fi
      # no cache in this workflow: a release is built from the checkout and crates.io only
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build -p triokey --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triokey-exe
          path: target/release/triokey.exe
          if-no-files-found: error
          retention-days: 1

  # Holds the signing key (a secret of the `release` environment, usable from v* tags only)
  # and the write permissions. It starts by itself once the build job passes. The only code built
  # here is xtask and its dependencies, which handle the key anyway. xtask is not taken from
  # the build job: a file from there must not be run next to the key.
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # build provenance attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key is set
        env:
          TRIOKEY_SIGN_KEY: ${{ secrets.TRIOKEY_SIGN_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TRIOKEY_SIGN_KEY" ]; then
            echo "::error::the secret TRIOKEY_SIGN_KEY of the environment 'release' is not set (docs/RELEASING.md)"
            exit 1
          fi
          # the build job has checked that the tag is v + the crate version
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Install the Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
      - name: Build the signing tool
        run: cargo build -p xtask --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triokey-exe
          path: dist
      # The secret is in this step's environment only, and only the already built xtask runs
      # in it: no file on disk, no build script, nothing echoed.
      - name: Sign
        env:
          TRIOKEY_SIGN_KEY: ${{ secrets.TRIOKEY_SIGN_KEY }}
        run: target/debug/xtask.exe sign env dist/triokey.exe --version "$VERSION"
      # Against the public key that was compiled into this very exe. Fails on the placeholder
      # key too, so a build that could never update is not published.
      - name: Verify the signature with the committed public key
        run: target/debug/xtask.exe verify crates/triokey/update-pubkey.txt dist/triokey.exe --version "$VERSION"
      - name: Package
        working-directory: dist
        run: |
          cp ../LICENSE ../NOTICE.md ../README.md ../README.vi.md .
          7z a "triokey-$VERSION-windows-x64.zip" triokey.exe triokey.exe.minisig LICENSE NOTICE.md README.md README.vi.md
          sha256sum triokey.exe triokey.exe.minisig "triokey-$VERSION-windows-x64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # extra, not what the updater relies on: a failure here does not stop the release
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/triokey.exe
      # The updater fetches releases/latest/download/triokey.exe(.minisig): the two bare asset
      # names must stay exactly these, and the release must not be a draft or a pre-release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/triokey.exe dist/triokey.exe.minisig "dist/triokey-$VERSION-windows-x64.zip" dist/SHA256SUMS.txt --title "TrioKey $VERSION" --generate-notes --verify-tag
